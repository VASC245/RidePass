# Configuración del CLI de Supabase.
# `supabase db start` / `supabase test db` (CI) usan este archivo para
# levantar un Postgres local con todas las migraciones.
project_id = "chivaspass"

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

# Desactivado en local/CI: la imagen de storage-api del CLI está rota (tag
# inexistente). El esquema storage (buckets, objects, foldername) ya viene en
# la imagen de Postgres, que es lo que usan las migraciones.
[storage]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[analytics]
enabled = false

# Todas las funciones exigen un JWT válido (anon key o sesión de usuario).
# public-reserve y kushki-charge además leen el JWT del usuario cuando lo hay
# para distinguir invitado / agencia / dueño.
[functions.public-reserve]
verify_jwt = true

[functions.kushki-charge]
verify_jwt = true

# Retirada: responde 410. Eliminar con `npx supabase functions delete send-ticket`.
[functions.send-ticket]
verify_jwt = true
